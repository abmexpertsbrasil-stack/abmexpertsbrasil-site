media:
  input: assets/uploads
  output: /assets/uploads
content:
  - name: agenda
    label: Agenda de eventos
    type: file
    path: data/agenda.json
    format: json
    fields:
      - name: eventos
        label: Eventos
        type: object
        list: true
        fields:
          - { name: data, label: "Data (eventos passados somem sozinhos)", type: date }
          - { name: dia, label: "Dia como aparece no site (ex.: 20/10)", type: string }
          - { name: hora, label: "Horário e formato (ex.: 19h · online)", type: string }
          - { name: titulo, label: Título, type: string }
          - { name: descricao, label: Descrição curta, type: text }
          - { name: cta, label: Texto do botão, type: string }
          - { name: link, label: Link de inscrição, type: string }
  - name: conteudos
    label: Conteúdos (podcast, frameworks, skills)
    type: file
    path: data/conteudos.json
    format: json
    fields:
      - name: itens
        label: Itens
        type: object
        list: true
        fields:
          - name: formato
            label: Formato
            type: select
            options:
              values: [Podcast, Framework, Skill de IA, Artigo, Entrevista, Webinar]
          - { name: titulo, label: Título, type: string }
          - { name: texto, label: Descrição, type: text }
          - { name: cta, label: Texto do botão, type: string }
          - { name: link, label: "Link (PDF, vídeo ou página). Vazio leva para Em breve", type: string }
          - { name: cta2, label: "Texto do segundo botão (opcional)", type: string }
          - { name: link2, label: "Link do segundo botão (opcional)", type: string }
  - name: cursos
    label: Cursos
    type: file
    path: data/cursos.json
    format: json
    fields:
      - name: cursos
        label: Cursos
        type: object
        list: true
        fields:
          - { name: selo, label: "Selo (ex.: Certificação, Curso livre)", type: string }
          - { name: titulo, label: Título, type: string }
          - { name: texto, label: Descrição, type: text }
          - { name: detalhes, label: "Detalhes (ex.: 4 blocos · acesso vitalício)", type: string }
          - { name: link, label: "Página de detalhes do curso (ex.: certificacao.html)", type: string }
  - name: depoimentos
    label: Depoimentos
    type: file
    path: data/depoimentos.json
    format: json
    fields:
      - name: depoimentos
        label: Depoimentos
        type: object
        list: true
        fields:
          - name: pagina
            label: "Página onde aparece"
            type: select
            options:
              values: [mentoria, certificacao]
          - { name: nome, label: Nome, type: string }
          - { name: cargo, label: "Descrição (ex.: Mentorada ABM Experts)", type: string }
          - { name: foto, label: "Foto (quadrada)", type: image }
          - { name: texto, label: "Depoimento (deixe uma linha em branco entre parágrafos)", type: text }
  - name: parceiros
    label: Parceiros
    type: file
    path: data/parceiros.json
    format: json
    fields:
      - name: parceiros
        label: Parceiros
        type: object
        list: true
        fields:
          - { name: nome, label: Nome, type: string }
          - name: categoria
            label: Categoria
            type: select
            options:
              values: [Eventos, Ferramentas, Consultorias, Mídia paga, Agências]
          - { name: destaque, label: "Especialidade (opcional, ex.: Petit comitês para ABM)", type: string }
          - { name: logo, label: Logo, type: image }
          - { name: texto, label: Minibio, type: text }
          - { name: cta, label: "Texto do botão (ex.: Quero falar com a Bora)", type: string }
